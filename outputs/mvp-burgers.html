<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mvp.burgers</title>
  <style>
    :root {
      --ink: #26143a;
      --muted: #766484;
      --line: #e3d6f0;
      --surface: rgba(255, 255, 255, .92);
      --surface-strong: #ffffff;
      --blue: #5c2d86;
      --blue-dark: #3a1d5f;
      --teal: #ffc928;
      --mint: #ffe06a;
      --mint-soft: #fff6cf;
      --warn: #f59f25;
      --danger: #d94e50;
      --shadow: rgba(55, 21, 87, .16);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f6f0fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 201, 40, .22), transparent 30%),
        radial-gradient(circle at 86% 4%, rgba(92, 45, 134, .18), transparent 28%),
        linear-gradient(135deg, rgba(92, 45, 134, .07) 0 1px, transparent 1px 26px),
        #fbf7ff;
    }
    button, input, select { font: inherit; }
    button { background: linear-gradient(135deg, #ffd43a, #f3a91f); border: 0; border-radius: 8px; box-shadow: 0 8px 18px rgba(92, 45, 134, .18); color: var(--blue-dark); cursor: pointer; font-weight: 900; min-height: 38px; padding: 9px 13px; text-transform: uppercase; }
    button:hover { filter: brightness(.94); }
    input, select { background: #fbfefe; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); min-height: 38px; padding: 8px 10px; width: 100%; }
    input:focus, select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(22, 166, 163, .14); outline: none; }
    label { display: grid; gap: 6px; }
    label span { color: var(--muted); font-size: .82rem; font-weight: 800; }
    .hint { color: var(--muted); font-size: .82rem; line-height: 1.35; margin: 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #eadff4; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #fff4c9; color: var(--blue-dark); font-size: .75rem; text-transform: uppercase; }
    .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .side {
      background:
        radial-gradient(circle at 34% 8%, rgba(255, 207, 49, .22), transparent 26%),
        linear-gradient(160deg, #3b1b62, #5b2d86 48%, #6f3aa1),
        var(--blue-dark);
      color: white;
      padding: 20px 14px;
      position: relative;
      overflow: hidden;
    }
    .side::after {
      background: linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.09) 1px, transparent 1px);
      background-size: 28px 28px;
      content: "";
      inset: 0;
      opacity: .18;
      pointer-events: none;
      position: absolute;
    }
    .side > * { position: relative; z-index: 1; }
    .brand { align-items: center; display: flex; gap: 10px; margin-bottom: 22px; }
    .mark { align-items: center; background: #ffc928; border: 1px solid rgba(255,255,255,.55); border-radius: 8px; box-shadow: 0 10px 22px rgba(0,0,0,.22); color: #5b2d86; display: inline-flex; font-family: Impact, "Arial Black", system-ui, sans-serif; font-size: 1.05rem; font-weight: 900; height: 46px; justify-content: center; letter-spacing: .4px; overflow: hidden; text-shadow: 0 2px 0 rgba(255,255,255,.55); width: 46px; }
    .mark img { height: 100%; object-fit: cover; width: 100%; }
    .brand strong { letter-spacing: .2px; }
    .brand small { color: #ffe8a3; display: block; margin-top: 3px; }
    .nav { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10); border-radius: 8px; color: #fff8dd; display: block; margin-bottom: 7px; text-align: left; width: 100%; }
    .nav.active { background: #ffc928; border-color: rgba(255,255,255,.35); color: var(--blue-dark); }
    .subnav { display: flex; flex-wrap: wrap; gap: 8px; }
    .subnav button { background: white; border: 1px solid var(--line); box-shadow: none; color: var(--blue); }
    .subnav button.active { background: linear-gradient(135deg, #ffd43a, #f3a91f); border-color: transparent; color: var(--blue-dark); }
    .main { display: grid; gap: 18px; padding: 28px; }
    .top { align-items: center; display: flex; justify-content: space-between; gap: 16px; }
    .top { background: rgba(255,255,255,.68); border: 1px solid rgba(227,214,240,.95); border-radius: 8px; padding: 16px; backdrop-filter: blur(10px); }
    .top p { color: var(--blue); font-size: .82rem; font-weight: 900; margin: 0; text-transform: uppercase; }
    .top h1 { color: var(--blue-dark); font-family: Impact, "Arial Black", system-ui, sans-serif; font-size: 2.15rem; letter-spacing: .4px; margin: 2px 0 0; text-shadow: 0 3px 0 rgba(255, 201, 40, .35); text-transform: uppercase; }
    .secondary { background: white; border: 1px solid var(--line); box-shadow: none; color: var(--blue); }
    .grid { display: grid; gap: 16px; }
    .metrics { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); }
    .metric, .panel { background: var(--surface); border: 1px solid rgba(227, 214, 240, .95); border-radius: 8px; box-shadow: 0 14px 34px var(--shadow); }
    .metric { display: grid; gap: 8px; min-height: 110px; overflow: hidden; padding: 15px; position: relative; }
    .metric::before { background: linear-gradient(135deg, var(--blue), var(--teal)); content: ""; height: 4px; left: 0; position: absolute; right: 0; top: 0; }
    .metric span { color: var(--muted); font-weight: 800; }
    .metric strong { color: var(--blue); font-size: 1.8rem; }
    .objective-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .objective-card { background: var(--surface); border: 1px solid rgba(227, 214, 240, .95); border-radius: 8px; box-shadow: 0 14px 34px var(--shadow); display: grid; gap: 12px; overflow: hidden; padding: 16px; position: relative; }
    .objective-card::before { background: linear-gradient(135deg, var(--blue), var(--teal)); content: ""; height: 4px; left: 0; position: absolute; right: 0; top: 0; }
    .objective-card.warn::before { background: linear-gradient(135deg, var(--warn), #f3cc75); }
    .objective-card h3 { color: var(--blue-dark); font-size: 1rem; margin: 0; }
    .objective-card .big { color: var(--blue); font-size: 2rem; font-weight: 900; line-height: 1; }
    .objective-card .summary { color: var(--muted); font-weight: 800; }
    .objective-stats { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .objective-stats div { background: #fffbeb; border: 1px solid #eadff4; border-radius: 8px; padding: 9px; }
    .objective-stats span { color: var(--muted); display: block; font-size: .72rem; font-weight: 900; text-transform: uppercase; }
    .objective-stats strong { color: var(--blue-dark); display: block; font-size: .95rem; margin-top: 3px; }
    .panel { padding: 17px; }
    .panel h2 { color: var(--blue-dark); font-size: 1.08rem; margin: 0 0 14px; }
    .split { display: grid; gap: 18px; grid-template-columns: minmax(280px, 390px) minmax(0, 1fr); }
    .form { display: grid; gap: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .report-actions { border-top: 1px solid #eadff4; display: flex; justify-content: flex-end; margin-top: 12px; padding-top: 12px; }
    .report-actions button { min-width: 170px; }
    .table-wrap { overflow-x: auto; }
    .text { background: transparent; box-shadow: none; color: var(--blue); min-height: auto; padding: 4px 7px; }
    .danger { color: var(--danger); }
    .alert, .rec { background: #fffdf6; border: 1px solid #eadff4; border-left: 4px solid var(--teal); border-radius: 8px; display: grid; gap: 4px; margin-bottom: 9px; padding: 11px; }
    .alert.warn { border-left-color: var(--warn); }
    .alert.danger { border-left-color: var(--danger); color: var(--ink); }
    .notice { background: var(--mint-soft); border: 1px solid #f3d56c; border-radius: 8px; color: var(--blue-dark); font-weight: 900; padding: 11px 13px; }
    .notification-stack { display: grid; gap: 10px; }
    .notification { align-items: center; background: #fff9e8; border: 1px solid #f0d48d; border-left: 5px solid var(--warn); border-radius: 8px; box-shadow: 0 14px 34px var(--shadow); display: flex; justify-content: space-between; gap: 14px; padding: 13px 15px; }
    .notification.danger { background: #fff0ed; border-color: #efb7ad; border-left-color: var(--danger); }
    .notification strong { color: var(--blue-dark); display: block; margin-bottom: 3px; }
    .notification span { color: var(--muted); font-size: .9rem; font-weight: 700; }
    .notification button { white-space: nowrap; }
    .nav-badge { background: var(--danger); border-radius: 999px; color: white; float: right; font-size: .72rem; font-weight: 900; min-width: 22px; padding: 2px 7px; text-align: center; }
    .bad-row { background: #fff8f4; }
    .status { border-radius: 999px; display: inline-flex; font-size: .76rem; font-weight: 900; padding: 5px 9px; white-space: nowrap; }
    .status.ok { background: #e2f7ee; color: #106b50; }
    .status.warn { background: #fff3d7; color: #8a5f08; }
    .status.danger { background: #ffe8e3; color: #a53d31; }
    .owner-grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(280px, 1fr)); }
    .chart-list { display: grid; gap: 12px; }
    .bar-row { display: grid; gap: 6px; }
    .bar-head { align-items: center; display: flex; justify-content: space-between; gap: 12px; }
    .bar-head strong { color: var(--blue-dark); }
    .bar-head span { color: var(--muted); font-weight: 800; white-space: nowrap; }
    .bar-track { background: #eee3f7; border-radius: 999px; height: 14px; overflow: hidden; }
    .bar-fill { background: linear-gradient(90deg, var(--blue), var(--teal), var(--mint)); border-radius: inherit; height: 100%; min-width: 3px; }
    .bar-fill.warn { background: linear-gradient(90deg, var(--warn), #f3cc75); }
    .bar-fill.danger { background: linear-gradient(90deg, var(--danger), #e08a7f); }
    .owner-note { align-items: center; background: #fffdf6; border: 1px solid #eadff4; border-radius: 8px; display: flex; justify-content: space-between; gap: 14px; padding: 12px; }
    .owner-note strong { color: var(--blue-dark); }
    .owner-note span { color: var(--muted); font-weight: 800; text-align: right; }
    .club-card { background: var(--surface); border: 1px solid rgba(227, 214, 240, .95); border-radius: 8px; box-shadow: 0 14px 34px var(--shadow); display: grid; gap: 10px; padding: 15px; }
    .club-card h3 { color: var(--blue-dark); margin: 0; }
    .club-card .club-meta { color: var(--muted); font-size: .86rem; font-weight: 800; }
    .voice-toolbar { align-items: center; background: #fff; border: 1px solid #e3d6f0; border-radius: 10px; box-shadow: 0 10px 28px rgba(43,23,71,.18); display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; left: 18px; padding: 10px 14px; position: fixed; right: 18px; top: 72px; z-index: 2147483647; }
    .voice-toolbar .actions { margin: 0; }
    .voice-status { color: var(--muted); font-size: .86rem; font-weight: 800; }
    .voice-status.active { color: #106b50; }
    .chat-shell { background: var(--surface); border: 1px solid rgba(227, 214, 240,.95); border-radius: 12px; box-shadow: 0 14px 34px var(--shadow); min-height: 720px; overflow: hidden; position: relative; }
    #webchat-container { height: 720px; position: relative; width: 100%; }
    #webchat-container .bpFab { display: none !important; }
    #webchat-container .bpWebchat, .bpWebchat { bottom: 0 !important; height: calc(100% - 138px) !important; left: 0 !important; max-height: calc(100% - 138px) !important; position: fixed !important; right: 0 !important; top: 138px !important; width: 100% !important; }
    @media (max-width: 980px) { .app { grid-template-columns: 1fr; } .side { position: static; } .metrics, .split, .owner-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>
  <script>
    const key = "smart-gastro-app-limpia-standalone";
    const today = new Date();
    const dateIn = days => {
      const d = new Date(today);
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    };
    const dateFrom = (dateText, days) => {
      const d = new Date(`${dateText}T00:00:00`);
      d.setDate(d.getDate() + Number(days || 0));
      return d.toISOString().slice(0, 10);
    };
    const implementationDate = "2026-05-01";
    const demo = {
      suppliers: [],
      ingredients: [],
      products: [],
      purchases: [],
      sales: [],
      events: [],
      preImplementationPurchases: [],
      preImplementationSales: [],
      postImplementationPurchases: [],
      postImplementationSales: [],
      clubs: [],
      clubPointMovements: [],
      clubBenefits: [],
      objectiveBaseline: { stockBreaks: 0, wasteQuantity: 0, urgentPurchases: 0 },
      objectiveBaselineUsesLotWaste: true,
      postPurchaseSchemaVersion: 4,
      warning: ""
    };
    const clone = value => JSON.parse(JSON.stringify(value));
    let state;
    try {
      state = JSON.parse(localStorage.getItem(key) || "null") || clone(demo);
    } catch (error) {
      state = clone(demo);
      localStorage.removeItem(key);
    }
    const defaultCosts = {
      "Pan de hamburguesa": 260,
      "Carne": 11.3,
      "Queso": 180,
      "Tomate": 2.8,
      "Lechuga": 2.2,
      "Cafe": 9.5,
      "Leche": 1.1
    };
    const defaultCodes = {
      "Pan de hamburguesa": "ING-001",
      "Carne": "ING-002",
      "Queso": "ING-003",
      "Tomate": "ING-004",
      "Lechuga": "ING-005",
      "Cafe": "ING-006",
      "Leche": "ING-007"
    };
    const defaultCritical = {
      "Pan de hamburguesa": true,
      "Carne": true,
      "Queso": true,
      "Tomate": true,
      "Lechuga": true,
      "Leche": true
    };
    const defaultFoodGroups = {
      "Pan de hamburguesa": "panificados",
      "Carne": "proteinas",
      "Queso": "lacteos",
      "Tomate": "verduras",
      "Lechuga": "verduras",
      "Cafe": "no perecedero",
      "Leche": "lacteos"
    };
    const defaultShelfLifeDays = {
      "Pan de hamburguesa": 18,
      "Carne": 6,
      "Queso": 15,
      "Tomate": 7,
      "Lechuga": 7
    };
    const defaultExpirySource = {
      "Pan de hamburguesa": "estimado",
      "Carne": "estimado",
      "Queso": "estimado",
      "Tomate": "estimado",
      "Lechuga": "estimado",
      "Cafe": "paquete",
      "Leche": "paquete"
    };
    const perishableGroups = ["lacteos", "verduras", "panificados", "proteinas"];
    const objectiveTargets = {
      stockBreaks: { label: "Quiebres de stock", target: 30, unit: "casos", baselineLabel: "Quiebres mensuales antes de instalar la app" },
      wasteQuantity: { label: "Desperdicio perecedero", target: 40, unit: "unidades/gr/ml", baselineLabel: "Desperdicio mensual antes de instalar la app" },
      urgentPurchases: { label: "Compras imprevistas y urgentes", target: 25, unit: "compras", baselineLabel: "Compras urgentes mensuales antes de instalar la app" }
    };
    const shelfLifeByIngredientId = { "ing-1": 18, "ing-2": 6, "ing-3": 15, "ing-4": 7, "ing-5": 7, "ing-6": 120, "ing-7": 8 };
    const purchaseWithExpiry = purchase => ({
      ...purchase,
      expiryDate: purchase.expiryDate || dateFrom(purchase.date, shelfLifeByIngredientId[purchase.ingredientId] || 30)
    });
    function lotWasteRows(purchases, sales, options = {}) {
      const asOfDate = options.asOfDate || new Date().toISOString().slice(0, 10);
      const products = options.products || demo.products;
      const ingredients = options.ingredients || demo.ingredients;
      const lots = (purchases || [])
        .map(purchaseWithExpiry)
        .map(purchase => {
          const ingredient = ingredients.find(item => item.id === purchase.ingredientId) || {};
          const unitCost = Number(purchase.quantity || 0) > 0 ? Number(purchase.totalPrice || 0) / Number(purchase.quantity || 0) : Number(ingredient.costUnit || 0);
          return { ...purchase, ingredient, unitCost, remaining: Number(purchase.quantity || 0) };
        })
        .filter(lot => lot.expiryDate && lot.ingredientId && (lot.ingredient.isCritical || perishableGroups.includes(lot.ingredient.foodGroup)));

      (sales || [])
        .slice()
        .sort((a, b) => String(a.date).localeCompare(String(b.date)))
        .forEach(sale => {
          const product = products.find(item => item.id === sale.productId) || {};
          (product.recipe || []).forEach(recipeItem => {
            let needed = Number(recipeItem.quantity || 0) * Number(sale.quantity || 0);
            lots
              .filter(lot => lot.ingredientId === recipeItem.ingredientId && lot.date <= sale.date && lot.expiryDate >= sale.date && lot.remaining > 0)
              .sort((a, b) => String(a.expiryDate).localeCompare(String(b.expiryDate)) || String(a.date).localeCompare(String(b.date)))
              .forEach(lot => {
                if (needed <= 0) return;
                const used = Math.min(lot.remaining, needed);
                lot.remaining -= used;
                needed -= used;
              });
          });
        });

      return lots.map(lot => {
        const wasteQuantity = lot.expiryDate <= asOfDate ? Math.max(Number(lot.remaining || 0), 0) : 0;
        return {
          ...lot,
          wasteQuantity,
          wasteValue: wasteQuantity * Number(lot.unitCost || 0)
        };
      });
    }
    const lotWasteTotal = (purchases, sales, options = {}) => lotWasteRows(purchases, sales, options).reduce((total, row) => ({
      quantity: total.quantity + Number(row.wasteQuantity || 0),
      value: total.value + Number(row.wasteValue || 0)
    }), { quantity: 0, value: 0 });
    const defaultPreImplementationPurchases = [];
    const defaultPreImplementationSales = [];
    const defaultPostImplementationPurchases = [];
    const defaultPostImplementationSales = [];
    const defaultObjectiveBaseline = {
      stockBreaks: defaultPreImplementationPurchases.reduce((total, purchase) => total + Number(purchase.stockBreaks || 0), 0),
      wasteQuantity: lotWasteTotal(defaultPreImplementationPurchases, defaultPreImplementationSales).quantity,
      urgentPurchases: defaultPreImplementationPurchases.filter(purchase => purchase.isUrgent).length
    };
    const isPerishable = ingredient => perishableGroups.includes(ingredient.foodGroup);
    state.ingredients = (state.ingredients || []).map((i, index) => ({
      code: defaultCodes[i.name] || `ING-${String(index + 1).padStart(3, "0")}`,
      costUnit: defaultCosts[i.name] || 0,
      foodGroup: defaultFoodGroups[i.name] || "otros",
      isCritical: Boolean(defaultCritical[i.name]),
      expirySource: defaultExpirySource[i.name] || "estimado",
      shelfLifeDays: defaultShelfLifeDays[i.name] || "",
      ...i
    })).map(i => ({ ...i, isCritical: Boolean(i.isCritical || isPerishable(i)) }));
    const mergeRowsById = (current, rowsToAdd) => {
      const rows = current || [];
      const ids = new Set(rows.map(row => row.id));
      return [...rowsToAdd.filter(row => !ids.has(row.id)), ...rows];
    };
    const postPurchaseSchemaVersion = 4;
    const shouldMigratePostPurchases = state.postPurchaseSchemaVersion !== postPurchaseSchemaVersion;
    const defaultPostPurchaseById = Object.fromEntries(defaultPostImplementationPurchases.map(purchase => [purchase.id, purchaseWithExpiry(purchase)]));
    const normalizePostSeededPurchase = purchase => {
      const seeded = defaultPostPurchaseById[purchase.id];
      if (!seeded) return purchaseWithExpiry(purchase);
      return shouldMigratePostPurchases ? purchaseWithExpiry(seeded) : purchaseWithExpiry(purchase);
    };
    state.sales = mergeRowsById((state.sales || []).filter(sale => !String(sale.id || "").startsWith("sale-demo-")), clone(defaultPostImplementationSales));
    state.purchases = mergeRowsById((state.purchases || []).filter(purchase => !String(purchase.id || "").startsWith("pur-demo-")), clone(defaultPostImplementationPurchases)).map(purchase => ({
      isUrgent: false,
      urgentReason: "",
      ...purchase
    })).map(normalizePostSeededPurchase);
    state.preImplementationPurchases = ((state.preImplementationPurchases || []).length ? state.preImplementationPurchases : clone(defaultPreImplementationPurchases)).map(purchaseWithExpiry);
    state.preImplementationSales = (state.preImplementationSales || []).length ? state.preImplementationSales : clone(defaultPreImplementationSales);
    state.postImplementationPurchases = mergeRowsById(state.postImplementationPurchases || [], clone(defaultPostImplementationPurchases)).map(normalizePostSeededPurchase);
    state.postImplementationSales = (state.postImplementationSales || []).length ? state.postImplementationSales : clone(defaultPostImplementationSales);
    state.postPurchaseSchemaVersion = postPurchaseSchemaVersion;
    state.objectiveBaseline = {
      ...defaultObjectiveBaseline,
      ...(state.objectiveBaseline || {})
    };
    if (!state.objectiveBaselineUsesLotWaste) {
      state.objectiveBaseline.wasteQuantity = lotWasteTotal(state.preImplementationPurchases, state.preImplementationSales).quantity;
      state.objectiveBaselineUsesLotWaste = true;
    }
    const normalizeEvent = event => ({
      noticeDays: 30,
      impact: "medio",
      category: "otro",
      ...event
    });
    const existingEvents = (state.events || []).map(normalizeEvent);
    const existingEventKeys = new Set(existingEvents.map(event => event.id || `${event.name}-${event.date}`));
    const seededEvents = clone(demo.events)
      .map(normalizeEvent)
      .filter(event => !existingEventKeys.has(event.id || `${event.name}-${event.date}`));
    state.events = [...seededEvents, ...existingEvents];
    state.clubs = state.clubs || [];
    state.clubPointMovements = state.clubPointMovements || [];
    state.clubBenefits = state.clubBenefits || [];
    let tab = "owner";
    let editingIngredientId = "";
    let editingPurchaseId = "";
    let editingSaleId = "";
    let editingProductId = "";
    let editingSupplierId = "";
    let selectedPurchaseIngredientId = "";
    let dashboardView = "resumen";
    let ownerPeriod = "90";
    let purchasePeriod = "90";
    let salesPeriod = "90";
    let salesFilterStart = "";
    let salesFilterEnd = "";
    const money = n => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(Number(n || 0));
    const num = n => new Intl.NumberFormat("es-AR", { maximumFractionDigits: 2 }).format(Number(n || 0));
    const parseNumber = value => {
      if (typeof value === "number") return value;
      const text = String(value || "").trim();
      if (!text) return 0;
      const normalized = text.replace(/\s/g, "").replace(/\./g, "").replace(",", ".");
      const parsed = Number(normalized);
      return Number.isFinite(parsed) ? parsed : 0;
    };
    const formNumber = value => value === undefined || value === null || value === "" ? "" : num(value);
    const id = prefix => prefix + "-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    const save = () => localStorage.setItem(key, JSON.stringify(state));

      const ranking = [...state.clubs].sort((a, b) => clubPoints(b.id) - clubPoints(a.id));
      const totalPoints = ranking.reduce((total, club) => total + clubPoints(club.id), 0);
      const linkedSales = state.sales.filter(sale => sale.clubId).length;
      const leader = ranking[0];
      const clubOptions = state.clubs.map(club => `<option value="${club.id}">${club.name} - ${club.neighborhood}</option>`).join("");
      const cards = ranking.length ? `<div class="objective-cards">${ranking.map((club, index) => { const points = clubPoints(club.id); const goal = clubGoal(points); const previous = goal.points === 500 ? 0 : goal.points - 500; const progress = Math.min(100, Math.max(0, (points - previous) / (goal.points - previous) * 100)); return `<article class="club-card"><div class="bar-head"><h3>${index + 1}. ${club.name}</h3><strong>${num(points)} puntos</strong></div><div class="club-meta">${club.neighborhood} · ${club.sport} · Convenio ${club.active === false ? "inactivo" : "activo"}</div><div class="bar-track"><div class="bar-fill" style="width:${progress}%"></div></div><p class="hint">Próxima meta: ${goal.name} al alcanzar ${num(goal.points)} puntos.</p><div class="actions"><button class="secondary" onclick="toggleClub('${club.id}')">${club.active === false ? "Activar" : "Pausar"}</button><button class="text danger" onclick="deleteClub('${club.id}')">Eliminar</button></div></article>`; }).join("")}</div>` : `<div class="notice">Todavía no hay clubes adheridos. Cargá el primer convenio para comenzar.</div>`;
      const movements = state.clubPointMovements.length ? `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Club</th><th>Motivo</th><th>Puntos</th></tr></thead><tbody>${state.clubPointMovements.map(row => `<tr><td>${row.date}</td><td>${byId(state.clubs, row.clubId).name || "Club eliminado"}</td><td>${row.reason}</td><td>${num(row.points)}</td></tr>`).join("")}</tbody></table></div>` : "Sin ajustes manuales.";
      const benefits = state.clubBenefits.length ? `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Club</th><th>Beneficio entregado</th><th>Detalle</th></tr></thead><tbody>${state.clubBenefits.map(row => `<tr><td>${row.date}</td><td>${byId(state.clubs, row.clubId).name || "Club eliminado"}</td><td>${row.type}</td><td>${row.detail || "-"}</td></tr>`).join("")}</tbody></table></div>` : "Todavía no hay beneficios entregados.";
      layout(`<section class="grid"><div class="metrics"><div class="metric"><span>Puntos acumulados</span><strong>${num(totalPoints)}</strong></div><div class="metric"><span>Clubes adheridos</span><strong>${state.clubs.length}</strong></div><div class="metric"><span>Ventas vinculadas</span><strong>${linkedSales}</strong></div><div class="metric"><span>Club con mayor apoyo</span><strong>${leader ? leader.name : "Sin datos"}</strong></div></div><div class="panel"><h2>Clasificación y progreso de clubes</h2><p class="hint">Los puntos institucionales de MVP Draft se calculan a razón de 10 puntos por hamburguesa vendida. No son Puntos Verdes.</p>${cards}</div><div class="split"><div class="panel"><h2>Agregar club barrial</h2><form class="form" onsubmit="addClub(event)"><label><span>Nombre del club</span><input name="name" required></label><label><span>Barrio / localidad</span><input name="neighborhood" required></label><label><span>Deporte principal</span><input name="sport" placeholder="Ej: básquet, fútbol, hockey" required></label><label><span>Contacto</span><input name="contact" placeholder="Nombre, teléfono o correo"></label><button>Registrar convenio</button></form></div><div class="panel"><h2>Ajustar puntos</h2><form class="form" onsubmit="addClubPoints(event)"><label><span>Club</span><select name="clubId" required>${clubOptions}</select></label><label><span>Fecha</span><input name="date" type="date" value="${todayISO()}" required></label><label><span>Puntos</span><input name="points" type="number" required></label><label><span>Motivo</span><input name="reason" placeholder="Ej: jornada especial o corrección" required></label><button ${state.clubs.length ? "" : "disabled"}>Registrar movimiento</button></form></div></div><div class="split"><div class="panel"><h2>Registrar beneficio entregado</h2><form class="form" onsubmit="addClubBenefit(event)"><label><span>Club</span><select name="clubId" required>${clubOptions}</select></label><label><span>Fecha</span><input name="date" type="date" value="${todayISO()}" required></label><label><span>Tipo</span><select name="type"><option>Equipamiento deportivo</option><option>Indumentaria</option><option>Apoyo para competencia</option><option>Evento conjunto</option></select></label><label><span>Detalle</span><input name="detail" placeholder="Descripción de lo entregado"></label><button ${state.clubs.length ? "" : "disabled"}>Registrar entrega</button></form></div><div class="panel"><h2>Metas del programa</h2><div class="rec"><strong>500 puntos</strong><span>Equipamiento deportivo</span></div><div class="rec"><strong>1.000 puntos</strong><span>Indumentaria</span></div><div class="rec"><strong>1.500 puntos</strong><span>Apoyo para competencias</span></div><div class="rec"><strong>2.000 puntos</strong><span>Evento conjunto con MVP Burgers</span></div></div></div><div class="panel"><h2>Movimientos de puntos</h2>${movements}</div><div class="panel"><h2>Beneficios entregados</h2>${benefits}</div></section>`);
    }
    let mvpAssistantInitialized = false;
    let voiceEnabled = false;
    let lastBotResponse = "";
    const extractBotText = message => {
      const payload = message && (message.payload || message.data || {});
      const candidates = [message && message.text, payload.text, payload.body, payload.message, payload.title];
      return candidates.find(value => typeof value === "string" && value.trim()) || "";
    };
    function preferredSpanishVoice() {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      return voices.find(voice => /^es-AR$/i.test(voice.lang)) || voices.find(voice => /^es(-|_)/i.test(voice.lang)) || null;
    }
    function speakMvpText(text) {
      if (!text || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.replace(/[*#_`]/g, " "));
      utterance.lang = "es-AR";
      utterance.rate = 0.96;
      utterance.pitch = 1;
      const voice = preferredSpanishVoice();
      if (voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
    }
    function updateVoiceStatus() {
      const status = document.getElementById("voice-status");
      const button = document.getElementById("voice-toggle");
      if (status) {
        status.textContent = voiceEnabled ? "Voz activada: las nuevas respuestas se leerán automáticamente." : "Voz desactivada.";
        status.classList.toggle("active", voiceEnabled);
      }
      if (button) button.textContent = voiceEnabled ? "🔇 Desactivar voz" : "🔊 Activar voz";
    }
    window.toggleMvpVoice = () => {
      if (!("speechSynthesis" in window)) return alert("Este navegador no permite lectura en voz alta.");
      voiceEnabled = !voiceEnabled;
      if (!voiceEnabled) window.speechSynthesis.cancel();
      updateVoiceStatus();
      if (voiceEnabled) {
        speakMvpText(lastBotResponse || "Voz activada. Ya podés hacer tu pregunta.");
      }
    };
    window.repeatMvpResponse = () => lastBotResponse ? speakMvpText(lastBotResponse) : alert("Todavía no hay una respuesta del bot para reproducir.");
    window.stopMvpVoice = () => window.speechSynthesis && window.speechSynthesis.cancel();
    function initMvpAssistant() {
      if (!window.botpress || mvpAssistantInitialized) return;
      mvpAssistantInitialized = true;
      window.botpress.on("webchat:initialized", () => window.botpress.open());
      window.botpress.on("message", message => {
        if (message && message.direction && message.direction !== "outgoing") return;
        const text = extractBotText(message);
        if (!text) return;
        lastBotResponse = text;
        if (voiceEnabled) speakMvpText(text);
      });
      window.botpress.init({
        botId: "87b5b730-f57c-4b01-942a-7b96375cd74f",
        clientId: "1a9125cd-b3fd-492a-a0a9-3fc0dadb20d1",
        configuration: {
          botName: "Entrenador MVP",
          botAvatar: "https://files.bpcontent.cloud/2026/08/30/03/20260830030155-EZ6RE063.png",
          botDescription: "Entrenador MVP puede presentarte el proyecto completo y responder consultas sobre sus productos, iniciativas y triple impacto.",
          color: "#9929bd",
          themeMode: "light",
          fontFamily: "system-ui",
          feedbackEnabled: true,
          allowFileUpload: true,
          conversationHistory: true,
          homePageEnabled: true,
          welcomeHeading: "¡Hola! ¿Cómo podemos ayudarte?",
          welcomeSubtitle: "Elegí una opción o escribí tu pregunta para conocer el proyecto de MVP Burgers."
        }
      });
    }
    function assistant() {
      layout(`<section class="grid"><div class="notice">Entrenador MVP responde únicamente con la información validada del proyecto MVP Burgers.</div><div class="voice-toolbar"><span id="voice-status" class="voice-status">Voz desactivada.</span><div class="actions"><button id="voice-toggle" type="button" onclick="toggleMvpVoice()">🔊 Activar voz</button><button class="secondary" type="button" onclick="repeatMvpResponse()">↻ Repetir última respuesta</button><button class="secondary" type="button" onclick="stopMvpVoice()">■ Detener</button></div></div><div class="chat-shell"><div id="webchat-container" aria-label="Chat de Entrenador MVP"></div></div></section>`);
      updateVoiceStatus();
      initMvpAssistant();
      if (mvpAssistantInitialized && window.botpress && window.botpress.open) window.botpress.open();
    }
    function events() {
      const categoryOptions = ["feriado", "fecha patria", "deportivo", "temporada", "otro"].map(category => `<option>${category}</option>`).join("");
      const impactOptions = ["alto", "medio", "bajo"].map(impact => `<option>${impact}</option>`).join("");
      const rows = state.events.length ? `<div class="table-wrap"><table><thead><tr><th>Evento</th><th>Tipo</th><th>Fecha</th><th>Anticipacion</th><th>Impacto</th><th>Estado</th><th></th></tr></thead><tbody>${state.events.map(event => { const days = eventDaysUntil(event.date); const active = days >= 0 && days <= Number(event.noticeDays || 30); return `<tr><td>${event.name}</td><td>${event.category}</td><td>${event.date}</td><td>${event.noticeDays} dia(s)</td><td>${impactLabel(event.impact)}</td><td><span class="status ${active ? event.impact === "alto" ? "danger" : "warn" : "ok"}">${days < 0 ? "Pasado" : active ? `Avisar ahora (${days} dia(s))` : `Faltan ${days} dia(s)`}</span></td><td><button class="text danger" onclick="removeItem('events','${event.id}')">Eliminar</button></td></tr>`; }).join("")}</tbody></table></div>` : "Todavia no hay eventos cargados.";
      layout(`<section class="split"><div class="panel"><h2>Agregar evento importante</h2><form class="form" onsubmit="addEvent(event)"><label><span>Nombre del evento</span><input name="name" placeholder="Ej: final de futbol, feriado, fecha patria" required></label><label><span>Tipo</span><select name="category">${categoryOptions}</select></label><label><span>Fecha</span><input name="date" type="date" required></label><label><span>Anticipacion del aviso</span><input name="noticeDays" type="text" inputmode="decimal" value="30" required></label><label><span>Impacto esperado en ventas</span><select name="impact">${impactOptions}</select></label><p class="hint">La IA avisa cuando el evento entra dentro de la anticipacion configurada. Ejemplo: si cargas 30 dias, avisa desde un mes antes.</p><div class="actions"><button>Agregar evento</button></div></form></div><div class="panel"><h2>Eventos cargados</h2>${rows}</div></section>`);
    }
    function ai() {
      const prediction = predictionSummary();
      const predictionRows = prediction.rows;
      const eventRecs = upcomingEvents().flatMap(event => {
        const suggestions = eventStockSuggestions(event);
        const base = [`Evento cercano: ${event.name} (${event.category}) en ${event.days} dia(s). Preparar stock por impacto ${impactLabel(event.impact)}.`];
        return suggestions.length ? [...base, ...suggestions.map(row => `Para ${event.name}, revisar ${ingredientTitle(row.ingredient)}. Productos relacionados: ${row.products.join(", ")}.`)] : base;
      });
      const predictionRecs = predictionRows.slice(0, 3).map(row => `Prediccion de ventas: ${row.product.name} podria vender ${num(row.predictedTomorrow)} unidad(es) manana. Tendencia ${row.trend}, promedio diario ${num(row.dailyAverage)} y ajuste por ${row.eventBoost.reason}.`);
      const recs = [...predictionRecs, ...eventRecs, ...stockBreakRows().map(row => `${row.status.label === "Quiebre" ? "Quiebre de stock" : "Riesgo de quiebre"} en ${ingredientTitle(row.ingredient)}: faltan ${num(row.missingToMin)} ${row.ingredient.unit} para llegar al minimo.`), ...low().map(i => `Comprar ${ingredientTitle(i)}: el stock esta por debajo del minimo.`), ...expiring().map(lot => `Usar ${ingredientTitle(lot.ingredient)} antes del vencimiento.`), ...wasteRows().map(row => `${row.days < 0 ? "Registrar desperdicio" : "Priorizar uso"} de ${ingredientTitle(row.ingredient)}: ${num(wasteQuantity(row))} ${row.ingredient.unit} en riesgo o perdida.`)];
      layout(`<section class="grid"><div class="metrics"><div class="metric"><span>Venta prevista manana</span><strong>${num(prediction.totalTomorrow)}</strong></div><div class="metric"><span>Facturacion prevista</span><strong>${money(prediction.revenueTomorrow)}</strong></div><div class="metric"><span>Margen previsto</span><strong>${money(prediction.marginTomorrow)}</strong></div><div class="metric"><span>Producto lider</span><strong>${prediction.leader ? prediction.leader.product.name : "Sin datos"}</strong></div></div><div class="panel"><h2>Prediccion IA de ventas</h2><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Ventas historicas</th><th>Promedio diario</th><th>Tendencia</th><th>Evento / ajuste</th><th>Prediccion manana</th><th>Prediccion 7 dias</th><th>Margen previsto manana</th></tr></thead><tbody>${predictionRows.map(row => `<tr><td>${row.product.name}</td><td>${num(row.sold)}</td><td>${num(row.dailyAverage)}</td><td><span class="status ${row.trend === "sube" ? "ok" : row.trend === "baja" ? "warn" : ""}">${row.trend}</span></td><td>${row.eventBoost.reason}<br>Factor ${num(row.eventBoost.factor)}</td><td><strong>${num(row.predictedTomorrow)}</strong></td><td>${num(row.predictedWeek)}</td><td>${money(row.marginTomorrow)}</td></tr>`).join("")}</tbody></table></div><p class="hint">La prediccion toma el historial de ventas, compara los ultimos dias contra los anteriores y ajusta la demanda si hay eventos cercanos de impacto. Es una IA simulada para ejercitar la logica del MVP.</p></div><div class="panel"><h2>Recomendaciones IA</h2>${recs.map(r => `<div class="rec"><strong>IA</strong><span>${r}</span></div>`).join("")}</div></section>`);
    }
    function history(rows, columns, type) {
      if (!rows.length) return "Todavia no hay registros.";
      return `<div class="table-wrap"><table><tbody>${rows.map(r => `<tr>${columns.map(c => `<td>${c === "ingredientId" ? byId(state.ingredients, r[c]).name : c === "productId" ? byId(state.products, r[c]).name : c === "totalPrice" ? money(r[c]) : num(r[c]) || r[c]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    window.addIngredient = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const ingredient = { ...f, stock: parseNumber(f.stock), minStock: parseNumber(f.minStock), costUnit: parseNumber(f.costUnit), isCritical: f.isCritical === "true" || perishableGroups.includes(f.foodGroup), supplierId: "" }; if (editingIngredientId) { state.ingredients = state.ingredients.map(i => i.id === editingIngredientId ? { ...i, ...ingredient, id: editingIngredientId } : i); editingIngredientId = ""; } else { state.ingredients.unshift({ ...ingredient, id: id("ing") }); } save(); render(); };
    window.editIngredient = ingredientId => { editingIngredientId = ingredientId; render(); };
    window.cancelIngredientEdit = () => { editingIngredientId = ""; render(); };
    window.addProduct = e => { e.preventDefault(); const formData = new FormData(e.target); const f = Object.fromEntries(formData); const recipe = state.ingredients.map(ingredient => ({ ingredientId: ingredient.id, quantity: parseNumber(formData.get(`recipe-${ingredient.id}`)) })).filter(item => item.quantity > 0); const product = { code: f.code, name: f.name, price: parseNumber(f.price), category: f.category, recipe }; if (editingProductId) { state.products = state.products.map(p => p.id === editingProductId ? { ...p, ...product, id: editingProductId } : p); editingProductId = ""; } else { state.products.unshift({ ...product, id: id("prod") }); } save(); render(); };
    window.editProduct = productId => { editingProductId = productId; render(); };
    window.cancelProductEdit = () => { editingProductId = ""; render(); };
    window.deleteProduct = productId => { state.sales.filter(s => s.productId === productId).forEach(sale => moveSaleStock(sale, 1)); state.products = state.products.filter(p => p.id !== productId); state.sales = state.sales.filter(s => s.productId !== productId); editingProductId = ""; editingSaleId = ""; save(); render(); };
    window.addSupplier = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const supplier = { ...f, referencePrice: parseNumber(f.referencePrice) }; if (editingSupplierId) { state.suppliers = state.suppliers.map(s => s.id === editingSupplierId ? { ...s, ...supplier, id: editingSupplierId } : s); editingSupplierId = ""; } else { state.suppliers.unshift({ ...supplier, id: id("sup") }); } save(); render(); };
    window.editSupplier = supplierId => { editingSupplierId = supplierId; render(); };
    window.cancelSupplierEdit = () => { editingSupplierId = ""; render(); };
    window.deleteSupplier = supplierId => { state.suppliers = state.suppliers.filter(s => s.id !== supplierId); state.ingredients = state.ingredients.map(i => i.supplierId === supplierId ? { ...i, supplierId: "" } : i); editingSupplierId = ""; save(); render(); };
    const syncPostPurchaseHistory = purchase => {
      const rows = (state.postImplementationPurchases || []).filter(row => row.id !== purchase.id);
      state.postImplementationPurchases = purchase.date >= implementationDate ? [purchase, ...rows] : rows;
    };
    const syncPostSaleHistory = sale => {
      const rows = (state.postImplementationSales || []).filter(row => row.id !== sale.id);
      state.postImplementationSales = sale.date >= implementationDate ? [sale, ...rows] : rows;
    };
    window.addPurchase = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const purchase = { ...f, quantity: parseNumber(f.quantity), totalPrice: parseNumber(f.totalPrice), isUrgent: f.isUrgent === "true", urgentReason: String(f.urgentReason || "").trim() };
      const selected = byId(state.ingredients, purchase.ingredientId);
      if (!purchase.expiryDate) purchase.expiryDate = suggestedPurchaseExpiry(selected, purchase.date);
      if (!purchase.isUrgent) purchase.urgentReason = "";
      const purchaseId = editingPurchaseId || id("pur");
      const savedPurchase = purchaseWithExpiry({ ...purchase, id: purchaseId });
      if (editingPurchaseId) {
        const old = byId(state.purchases, editingPurchaseId);
        const oldIng = byId(state.ingredients, old.ingredientId);
        oldIng.stock = Number(oldIng.stock) - Number(old.quantity);
        const newIng = byId(state.ingredients, savedPurchase.ingredientId);
        newIng.stock = Number(newIng.stock) + Number(savedPurchase.quantity);
        if (Number(savedPurchase.quantity) > 0) newIng.costUnit = Number(savedPurchase.totalPrice) / Number(savedPurchase.quantity);
        state.purchases = state.purchases.map(p => p.id === editingPurchaseId ? savedPurchase : p);
        editingPurchaseId = "";
      } else {
        const ing = byId(state.ingredients, savedPurchase.ingredientId);
        ing.stock = Number(ing.stock) + Number(savedPurchase.quantity);
        if (Number(savedPurchase.quantity) > 0) ing.costUnit = Number(savedPurchase.totalPrice) / Number(savedPurchase.quantity);
        state.purchases.unshift(savedPurchase);
      }
      syncPostPurchaseHistory(savedPurchase);
      state.warning = "";
      save();
      render();
    };
    window.editPurchase = purchaseId => {
      const purchase = byId(state.purchases, purchaseId);
      if (!purchase.id) {
        const postPurchase = byId(state.postImplementationPurchases || [], purchaseId);
        if (postPurchase.id) state.purchases.unshift(postPurchase);
      }
      editingPurchaseId = purchaseId;
      render();
    };
    window.selectPurchaseIngredient = ingredientId => { selectedPurchaseIngredientId = ingredientId; render(); };
    window.cancelPurchaseEdit = () => { editingPurchaseId = ""; render(); };
    window.deletePurchase = purchaseId => { const purchase = byId(state.purchases, purchaseId); const ing = byId(state.ingredients, purchase.ingredientId); ing.stock = Number(ing.stock) - Number(purchase.quantity); state.purchases = state.purchases.filter(p => p.id !== purchaseId); state.postImplementationPurchases = (state.postImplementationPurchases || []).filter(p => p.id !== purchaseId); editingPurchaseId = ""; save(); render(); };
    window.addSale = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const sale = { ...f, quantity: parseNumber(f.quantity) };
      let old = null;
      if (editingSaleId) {
        old = byId(state.sales, editingSaleId);
        moveSaleStock(old, 1);
      }
      const warning = checkSale(sale.productId, sale.quantity);
      if (warning) {
        if (old) moveSaleStock(old, -1);
        state.warning = warning;
        save();
        render();
        return;
      }
      moveSaleStock(sale, -1);
      const saleId = editingSaleId || id("sale");
      const savedSale = { ...sale, id: saleId };
      if (editingSaleId) {
        state.sales = state.sales.map(s => s.id === editingSaleId ? savedSale : s);
        editingSaleId = "";
      } else {
        state.sales.unshift(savedSale);
      }
      syncPostSaleHistory(savedSale);
      state.warning = "";
      save();
      render();
    };
    window.editSale = saleId => { editingSaleId = saleId; render(); };
    window.cancelSaleEdit = () => { editingSaleId = ""; render(); };
    window.deleteSale = saleId => { const sale = byId(state.sales, saleId); moveSaleStock(sale, 1); state.sales = state.sales.filter(s => s.id !== saleId); state.postImplementationSales = (state.postImplementationSales || []).filter(s => s.id !== saleId); editingSaleId = ""; save(); render(); };
    window.addEvent = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const event = { ...f, noticeDays: parseNumber(f.noticeDays || 30), id: id("evt") }; state.events.unshift(event); save(); render(); };
    window.removeItem = (collection, itemId) => { state[collection] = state[collection].filter(x => x.id !== itemId); save(); render(); };
    window.addClub = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); state.clubs.unshift({ ...f, active: true, id: id("club") }); save(); render(); };
    window.toggleClub = clubId => { state.clubs = state.clubs.map(club => club.id === clubId ? { ...club, active: club.active === false } : club); save(); render(); };
    window.deleteClub = clubId => { state.clubs = state.clubs.filter(club => club.id !== clubId); save(); render(); };
    window.addClubPoints = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); state.clubPointMovements.unshift({ ...f, points: parseNumber(f.points), id: id("points") }); save(); render(); };
    window.addClubBenefit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); state.clubBenefits.unshift({ ...f, id: id("benefit") }); save(); render(); };
    window.saveObjectives = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); state.objectiveBaseline = { stockBreaks: parseNumber(f.stockBreaks), wasteQuantity: parseNumber(f.wasteQuantity), urgentPurchases: parseNumber(f.urgentPurchases) }; state.objectiveBaselineUsesLotWaste = true; save(); objectives(); };
    function render() {
      if (tab === "dashboard") dashboard();
      if (tab === "objectives") objectives();
      if (tab === "owner") ownerDashboard();
      if (tab === "ingredients") ingredients();
      if (tab === "products") products();
      if (tab === "suppliers") suppliers();
      if (tab === "purchases") purchases();
      if (tab === "sales") sales();
      if (tab === "events") events();
      if (tab === "clubs") clubs();
      if (tab === "ai") ai();
      if (tab === "assistant") assistant();
    }
    render();
  </script>
</body>
</html>
